[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bfgym-firmware"
version = "0.1.0"
description = "Real-Betaflight firmware compiled to NVPTX, with a Python loader and ctypes binding for libbfgym.so."
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
authors = [{ name = "Luke Wriglesworth", email = "luke@synetic.dev" }]
keywords = ["betaflight", "drone", "rl", "gpu", "cuda", "firmware"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: POSIX :: Linux",
]
dependencies = []  # core loader is stdlib-only (ctypes + importlib.resources)

[project.optional-dependencies]
torch = ["torch", "numpy"]
jax = ["jax"]
viz = ["torch", "numpy", "pygame"]

[project.scripts]
wall-of-betaflight = "bfgym_firmware.wall_of_betaflight:main"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"bfgym_firmware" = ["_data/*"]
